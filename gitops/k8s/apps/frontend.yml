# frontend — React SPA served by nginx; nginx proxies /api to the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: telugu-pickles
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: telugu-pickles
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: telugu-pickles/frontend
          ports:
            - name: http
              containerPort: 80
          env:
            - name: GATEWAY_URL
              value: http://gateway:8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/part-of: telugu-pickles
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public entry point: the AWS Load Balancer Controller turns this into an
# internet-facing Application Load Balancer in the public subnets.
# No host rule -> works on the ALB's own hostname. When a domain is configured,
# Terraform's Argo CD Application patches in shop.<domain> + HTTPS (ACM).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/part-of: telugu-pickles
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: telugu-pickles
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
